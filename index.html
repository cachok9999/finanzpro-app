<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F19" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="FinanzPro - Tu aplicación profesional de finanzas personales, presupuestos y control patrimonial para Android." />
  <title>FinanzPro - Finanzas Personales</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2454/2454282.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: '#6366F1',
            income: '#10B981',
            expense: '#F43F5E',
            savings: '#06B6D4'
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./src/css/styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">

  <!-- Mobile Phone Frame Simulator Container -->
  <div id="app-container" class="relative flex flex-col w-full h-full bg-[#07090E] overflow-hidden">
    
    <!-- Top Android Status Bar Simulation -->
    <div id="notch-indicator" class="hidden h-7 w-full bg-[#07090E] flex items-center justify-between px-6 pt-1 text-[11px] font-semibold text-slate-400 select-none z-30">
      <span class="font-mono">9:41</span>
      <div class="w-20 h-4 bg-slate-900 rounded-full mx-auto border border-slate-800/80"></div>
      <div class="flex items-center gap-1.5 text-slate-400">
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <i data-lucide="battery-charging" class="w-3.5 h-3.5 text-emerald-400"></i>
      </div>
    </div>

    <!-- Main View Content Area (Scrollable) -->
    <main id="view-content" class="flex-1 overflow-y-auto px-4 pt-3 pb-24 scroll-smooth">
      <!-- Views will be dynamically injected here by Router -->
    </main>

    <!-- Floating Action Button (FAB) for Quick Transaction -->
    <button id="main-fab" class="fab-button" title="Registrar Movimiento">
      <i data-lucide="plus" class="w-7 h-7 stroke-[2.5]"></i>
    </button>

    <!-- Bottom Navigation Bar (Android Fintech Style) -->
    <nav class="glass-panel absolute bottom-0 left-0 right-0 h-20 px-2 flex items-center justify-around border-t border-slate-800/80 z-40">
      <button data-route="dashboard" class="nav-item flex flex-col items-center justify-center w-14 py-1 text-indigo-400 font-bold transition">
        <i data-lucide="layout-grid" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px]">Inicio</span>
      </button>

      <button data-route="transactions" class="nav-item flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="receipt-text" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px]">Movimientos</span>
      </button>

      <button data-route="budgets" class="nav-item flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="pie-chart" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px]">Límites</span>
      </button>

      <button data-route="goals" class="nav-item flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="target" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px]">Metas</span>
      </button>

      <button data-route="debts" class="nav-item flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="flame" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px]">Deudas</span>
      </button>

      <button data-route="reports" class="nav-item flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="bar-chart-3" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px]">Reportes</span>
      </button>
    </nav>

    <!-- Global Toast Notification Container -->
    <div id="app-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-4"></div>

  </div>

  <!-- Main JavaScript App -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
